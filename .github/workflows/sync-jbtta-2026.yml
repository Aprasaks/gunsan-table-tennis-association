name: Sync Jeonbuk 2026 Tournaments

# Automatic synchronization is paused. Run manually from GitHub Actions only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-jbtta-2026
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install document preview tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Crawl Jeonbuk tournament board
        run: node scripts/sync-jbtta-2026.mjs
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - name: Commit updated tournament data
        run: |
          if git diff --quiet -- src/data/jbtta-2026.json public/jbtta/2026; then
            echo "No tournament data changes."
            exit 0
          fi
          git config user.name "gunsan-tt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/jbtta-2026.json public/jbtta/2026
          git commit -m "전북 2026 대회일정 수동 동기화"
          git pull --rebase origin main
          git push origin HEAD:main
