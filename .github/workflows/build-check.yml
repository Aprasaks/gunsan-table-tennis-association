name: Build Check

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions는 Vercel 환경변수를 상속하지 않습니다.
      # 빌드 중 Supabase 클라이언트 생성에 필요한 공개값만 CI용으로 제공합니다.
      NEXT_PUBLIC_SUPABASE_URL: https://eqtqyphnxhyliujfccyh.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
